<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual" />
  <meta name="theme-color" content="#0E1A12" />
  <title>바로팜</title>
  <link rel="icon" type="image/png" href="/app/assets/app-logo.png" />
  <link rel="apple-touch-icon" href="/app/assets/app-logo.png" />

  <!-- Fonts: Gowun Dodum (display) + Pretendard Variable (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <style>
    @font-face {
      font-family: 'Pretendard';
      src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2-variations');
      font-weight: 100 900;
      font-display: swap;
    }
  </style>

  <!-- Design System (Fresh Field) -->
  <link rel="stylesheet" href="/app/styles/tokens.css" />
  <link rel="stylesheet" href="/app/styles/base.css" />
  <link rel="stylesheet" href="/app/styles/type.css" />
  <link rel="stylesheet" href="/app/styles/layout.css" />
  <link rel="stylesheet" href="/app/styles/transitions.css" />
  <style>
    @font-face {
      font-family: 'GraceSerif';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2604-1@1.0/GraceSerif-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
  </style>
</head>
<body>
  <main id="app-root"></main>

  <!-- Frame lock: 키보드 등 height-only 변화에 frame 크기 고정 -->
  <script>
    (function () {
      var root = document.getElementById('app-root');
      if (!root) return;

      function lockFrame() {
        var h = window.innerHeight;
        var w = window.innerWidth;
        window._appLockedH = h;
        document.documentElement.style.height = h + 'px';
        document.body.style.height = h + 'px';
        root.style.height = h + 'px';
        root.style.width  = Math.min(w, Math.round(h * 16 / 9)) + 'px';
      }

      lockFrame();

      // width가 바뀔 때만(방향 전환·데스크탑 윈도우 조절) 재계산
      // 키보드는 height만 변경하고 width는 그대로 → 무시
      var _prevW = window.innerWidth;
      window.addEventListener('resize', function () {
        if (window.innerWidth !== _prevW) {
          _prevW = window.innerWidth;
          lockFrame();
        }
      });
    })();
  </script>

  <!-- socket.io-client (CDN) -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <!-- LiveKit client SDK (CDN UMD) — window.LivekitClient 전역 노출 -->
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

  <!-- SPA Router (entry) -->
  <script type="module" src="/app/scripts/router.js"></script>
</body>
</html>
