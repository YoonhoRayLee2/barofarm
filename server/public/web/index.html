  <main id="app-root"></main>

  <!-- Frame lock: 키보드 등 height-only 변화에 frame 크기 고정 -->
  <script>
    (function () {
      var root = document.getElementById('app-root');
      if (!root) return;

      function lockFrame() {
        var h = window.innerHeight;
        var w = window.innerWidth;
        document.documentElement.style.height = h + 'px';
        document.body.style.height = h + 'px';

        // 데스크탑(≥1024px): 앱을 모바일 폰 비율 카드로 띄우고 좌측은 브랜드 패널.
        if (w >= 1024) {
          // iPhone 14 Pro Max 비율(430 x 932 ≈ 9:19.4)로 길쭉한 폰 카드
          var frameH = Math.min(h - 64, 900);
          var frameW = Math.round(frameH * 430 / 932);
          window._appLockedH = frameH;
          root.style.height = frameH + 'px';
          root.style.width  = frameW + 'px';
        } else {
          window._appLockedH = h;
          root.style.height = h + 'px';
          root.style.width  = Math.min(w, Math.round(h * 16 / 9)) + 'px';
        }
      }

      lockFrame();

      // width가 바뀔 때만(방향 전환·데스크탑 윈도우 조절) 재계산
      // 키보드는 height만 변경하고 width는 그대로 → 무시
      var _prevW = window.innerWidth;
      window.addEventListener('resize', function () {
        if (window.innerWidth !== _prevW) {
          _prevW = window.innerWidth;
          lockFrame();
        }
      });
    })();
  </script>

  <!-- socket.io-client (CDN) -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
