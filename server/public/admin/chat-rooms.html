<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>채팅방 관리 · NH 바로팜 어드민</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script>try{var t=localStorage.getItem('adminTheme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body data-page="chat-rooms">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar__brand">NH <span class="accent">바로팜</span></div>
      <nav class="sidebar__nav">
        <a class="sidebar__link" href="/admin">대시보드</a>
        <a class="sidebar__link" href="/admin/users">사용자</a>
        <a class="sidebar__link" href="/admin/auctions">경매·라이브</a>
        <a class="sidebar__link" href="/admin/products">상품·거래</a>
        <a class="sidebar__link" href="/admin/settlements">정산</a>
        <a class="sidebar__link" href="/admin/reviews">리뷰</a>
        <a class="sidebar__link sidebar__link--active" href="/admin/chat-rooms">채팅방</a>
        <a class="sidebar__link" href="/admin/group-deals">공동구매</a>
        <a class="sidebar__link" href="/admin/consignments">위탁</a>
        <a class="sidebar__link" href="/admin/notice">공지</a>
        <a class="sidebar__link" href="/admin/payments">결제 관리</a>
        <a class="sidebar__link" href="/admin/wallet">지갑 관리</a>
        <a class="sidebar__link" href="/admin/payment-auth">인증 관리</a>
        <a class="sidebar__link" href="/admin/rest-auctions">경매 관리(REST)</a>
      </nav>
      <a id="logout-btn" class="sidebar__logout" href="#">로그아웃</a>
    </aside>

    <main class="main">
      <div class="page-pad">
        <div class="page-header">
          <h1>채팅방 관리</h1>
        </div>
        <div class="search-bar">
          <input type="text" id="cr-search" placeholder="방 이름 / 멤버 닉네임 검색">
          <select id="cr-type-filter">
            <option value="">전체</option>
            <option value="dm">1:1 DM</option>
            <option value="group">그룹</option>
          </select>
          <button id="cr-search-btn">검색</button>
        </div>
        <table class="data-table">
          <thead><tr><th>ID</th><th>유형</th><th>이름/참여자</th><th>멤버수</th><th>메시지수</th><th>마지막 메시지</th><th>마지막 활동</th></tr></thead>
          <tbody id="cr-tbody"></tbody>
        </table>
        <div class="pagination" id="cr-pagination"></div>
      </div>
    </main>
  </div>

  <div class="modal" id="cr-modal" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="cr-modal-title">채팅방 상세</h2>
        <button class="modal-close" id="cr-modal-close">✕</button>
      </div>
      <div id="cr-modal-body" class="modal-body"></div>
      <div class="modal-footer">
        <button id="cr-delete-room-btn" class="btn-small btn-danger">채팅방 삭제</button>
      </div>
    </div>
  </div>

  <script src="/admin/admin.js"></script>
</body>
</html>
