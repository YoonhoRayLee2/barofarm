<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>경매·라이브 · NH 바로팜 어드민</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script>try{var t=localStorage.getItem('adminTheme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="/admin/admin.css" />
  <script src="/socket.io/socket.io.js"></script>
</head>
<body data-page="auctions">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar__brand">NH <span class="accent">바로팜</span></div>
      <nav class="sidebar__nav">
        <a class="sidebar__link" href="/admin">대시보드</a>
        <a class="sidebar__link" href="/admin/users">사용자</a>
        <a class="sidebar__link sidebar__link--active" href="/admin/auctions">경매·라이브</a>
        <a class="sidebar__link" href="/admin/products">상품·거래</a>
        <a class="sidebar__link" href="/admin/settlements">정산</a>
        <a class="sidebar__link" href="/admin/reviews">리뷰</a>
        <a class="sidebar__link" href="/admin/group-deals">공동구매</a>
        <a class="sidebar__link" href="/admin/consignments">위탁</a>
        <a class="sidebar__link" href="/admin/notice">공지</a>
      </nav>
      <a id="logout-btn" class="sidebar__logout" href="#">로그아웃</a>
    </aside>

    <main class="main">
      <div class="page-pad">
        <div class="page-header">
          <h1>경매·라이브 모니터링</h1>
        </div>
        <section>
          <h2 style="padding:0">진행 중인 라이브</h2>
          <div id="live-cards" class="live-cards">로딩 중...</div>
        </section>
        <section style="margin-top:2rem">
          <div class="tab-bar">
            <button class="tab-btn tab-btn--active" data-tab="ended-auctions">종료 경매 이력</button>
            <button class="tab-btn" data-tab="live-history">라이브 이력</button>
          </div>
          <div id="tab-ended-auctions" class="tab-panel">
            <div class="search-bar">
              <select id="auction-status-filter"><option value="">전체 상태</option><option value="ended">종료</option></select>
              <select id="auction-delivery-filter"><option value="">전체 배송</option><option value="payment_complete">결제완료</option><option value="shipped">배송중</option><option value="purchase_confirmed">구매확정</option><option value="settlement_complete">정산완료</option></select>
              <button id="auction-search-btn">검색</button>
            </div>
            <table class="data-table">
              <thead><tr><th>ID</th><th>상품명</th><th>낙찰가</th><th>상태</th><th>배송상태</th><th>판매자</th><th>구매자</th><th>일시</th><th>수수료</th></tr></thead>
              <tbody id="auctions-tbody"></tbody>
            </table>
            <div class="pagination" id="auctions-pagination"></div>
          </div>
          <div id="tab-live-history" class="tab-panel" hidden>
            <table class="data-table">
              <thead><tr><th>ID</th><th>제목</th><th>판매자</th><th>카테고리</th><th>종료일시</th><th>통계</th></tr></thead>
              <tbody id="live-history-tbody"></tbody>
            </table>
            <div class="pagination" id="live-history-pagination"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="live-monitor-modal" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="live-monitor-title">라이브 관제</h3>
        <button class="modal-close" id="live-monitor-close">✕</button>
      </div>
      <div class="modal-meta" id="live-monitor-meta"></div>
      <div class="modal-body" style="padding-top:0">
        <div class="modal-section-title">진행 중인 경매</div>
        <div id="live-monitor-auction" class="text-muted">경매 없음</div>
        <div class="modal-field--row" id="live-monitor-extend-row" hidden style="margin-top:0.5rem">
          <input type="number" id="live-monitor-extend-seconds" value="10" min="1" max="600" style="width:80px" />
          <button id="live-monitor-extend-btn" class="btn-small">시간 연장(초)</button>
          <button id="live-monitor-auction-force-end-btn" class="btn-small btn-danger">경매 강제종료</button>
        </div>
        <div class="modal-section-title" style="margin-top:1rem">실시간 채팅</div>
        <div id="live-monitor-chat" class="live-monitor-chat"></div>
        <div class="modal-section-title" style="margin-top:1rem">입찰/구매 피드</div>
        <div id="live-monitor-feed" class="live-monitor-feed"></div>
      </div>
      <div class="modal-footer">
        <div class="modal-field--row" style="margin-right:auto">
          <span id="live-monitor-viewer-count" class="text-muted">시청자 0명</span>
        </div>
        <input type="text" id="live-monitor-kick-userid" placeholder="강퇴할 userId" style="width:140px" />
        <button id="live-monitor-kick-btn" class="btn-small btn-danger">강퇴</button>
        <button id="live-monitor-force-end-btn" class="btn-small btn-danger">라이브 강제종료</button>
        <button id="live-monitor-close2" class="btn-small btn-secondary">닫기</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="auction-modal" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="auction-modal-title">경매 상세</h3>
        <button class="modal-close" id="auction-modal-close">✕</button>
      </div>
      <div class="modal-meta" id="auction-modal-meta"></div>
      <div class="modal-body" style="padding-top:0">
        <div class="modal-section-title">입찰 내역</div>
        <table class="data-table" style="width:100%;margin:0">
          <thead><tr><th>입찰ID</th><th>입찰자</th><th>금액</th><th>일시</th><th>처리</th></tr></thead>
          <tbody id="auction-bids-tbody"></tbody>
        </table>
      </div>
      <div class="modal-footer">
        <div class="modal-field--row" style="margin-right:auto">
          <label style="font-size:var(--fs-sm);color:var(--ff-ink-mute)">배송상태</label>
          <select id="auction-delivery-select">
            <option value="payment_complete">결제완료</option>
            <option value="shipped">배송중</option>
            <option value="purchase_confirmed">구매확정</option>
            <option value="settlement_complete">정산완료</option>
          </select>
          <button id="auction-delivery-save-btn" class="btn-small">저장</button>
        </div>
        <button id="auction-force-end-btn" class="btn-small btn-danger" hidden>강제 종료</button>
        <button id="auction-delete-btn" class="btn-small btn-danger" hidden>삭제</button>
        <button id="auction-modal-close2" class="btn-small btn-secondary">닫기</button>
      </div>
    </div>
  </div>

  <script src="/admin/admin.js"></script>
</body>
</html>
