<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>위탁 관리 · NH 바로팜 어드민</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script>try{var t=localStorage.getItem('adminTheme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body data-page="consignments">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar__brand">NH <span class="accent">바로팜</span></div>
      <nav class="sidebar__nav">
        <a class="sidebar__link" href="/admin">대시보드</a>
        <a class="sidebar__link" href="/admin/users">사용자</a>
        <a class="sidebar__link" href="/admin/auctions">경매·라이브</a>
        <a class="sidebar__link" href="/admin/products">상품·거래</a>
        <a class="sidebar__link" href="/admin/settlements">정산</a>
        <a class="sidebar__link" href="/admin/reviews">리뷰</a>
        <a class="sidebar__link" href="/admin/group-deals">공동구매</a>
        <a class="sidebar__link sidebar__link--active" href="/admin/consignments">위탁</a>
        <a class="sidebar__link" href="/admin/notice">공지</a>
        <a class="sidebar__link" href="/admin/payments">결제 관리</a>
        <a class="sidebar__link" href="/admin/wallet">지갑 관리</a>
        <a class="sidebar__link" href="/admin/payment-auth">인증 관리</a>
        <a class="sidebar__link" href="/admin/rest-auctions">경매 관리(REST)</a>
      </nav>
      <a id="logout-btn" class="sidebar__logout" href="#">로그아웃</a>
    </aside>

    <main class="main">
      <div class="page-pad">
        <div class="page-header">
          <h1>위탁 관리</h1>
        </div>
        <div class="search-bar">
          <select id="cs-status-filter">
            <option value="">전체 상태</option>
            <option value="pending">대기</option>
            <option value="matched">매칭</option>
            <option value="closed">종료</option>
          </select>
          <button id="cs-search-btn">검색</button>
        </div>
        <table class="data-table">
          <thead><tr><th>ID</th><th>신청자</th><th>유형</th><th>카테고리</th><th>수량</th><th>희망가</th><th>상태</th><th>생성</th></tr></thead>
          <tbody id="cs-tbody"></tbody>
        </table>
        <div class="pagination" id="cs-pagination"></div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="cs-modal" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="cs-modal-title">위탁 상세</h3>
        <button class="modal-close" id="cs-modal-close">✕</button>
      </div>
      <div class="modal-meta" id="cs-modal-meta"></div>
      <div class="modal-body">
        <div id="cs-modal-images" class="cs-images"></div>
        <div class="modal-field" style="margin-top:0.75rem">
          <label>상태 변경</label>
          <select id="cs-status-select">
            <option value="pending">대기</option>
            <option value="matched">매칭</option>
            <option value="closed">종료</option>
          </select>
          <button id="cs-status-save-btn" class="btn-small">변경</button>
        </div>
      </div>
      <div class="modal-footer">
        <button id="cs-modal-close2" class="btn-small btn-secondary">닫기</button>
      </div>
    </div>
  </div>

  <script src="/admin/admin.js"></script>
</body>
</html>
