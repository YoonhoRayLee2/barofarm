<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1280" />
  <title>인증 관리 · NH 바로팜 어드민</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body data-page="payment-auth">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar__brand">NH <span class="accent">바로팜</span></div>
      <nav class="sidebar__nav">
        <a class="sidebar__link" href="/admin">대시보드</a>
        <a class="sidebar__link" href="/admin/users">사용자</a>
        <a class="sidebar__link" href="/admin/auctions">경매·라이브</a>
        <a class="sidebar__link" href="/admin/products">상품·거래</a>
        <a class="sidebar__link" href="/admin/settlements">정산</a>
        <a class="sidebar__link" href="/admin/reviews">리뷰</a>
        <a class="sidebar__link" href="/admin/group-deals">공동구매</a>
        <a class="sidebar__link" href="/admin/consignments">위탁</a>
        <a class="sidebar__link" href="/admin/notice">공지</a>
        <a class="sidebar__link" href="/admin/payments">결제 관리</a>
        <a class="sidebar__link" href="/admin/wallet">지갑 관리</a>
        <a class="sidebar__link sidebar__link--active" href="/admin/payment-auth">인증 관리</a>
        <a class="sidebar__link" href="/admin/rest-auctions">경매 관리(REST)</a>
      </nav>
      <a id="logout-btn" class="sidebar__logout" href="#">로그아웃</a>
    </aside>

    <main class="main">
      <div class="page-pad">
        <div class="page-header">
          <h1>인증 관리</h1>
        </div>
        <p class="text-muted">결제비밀번호는 해시로만 저장되어 원문을 조회할 수 없습니다. 설정여부/실패횟수/잠금상태만 확인할 수 있습니다.</p>
        <div class="search-bar">
          <input type="text" id="auth-user-search" placeholder="아이디 / 닉네임으로 사용자 검색">
          <button id="auth-user-search-btn">검색</button>
        </div>
        <table class="data-table">
          <thead><tr><th>ID</th><th>아이디</th><th>닉네임</th><th>역할</th></tr></thead>
          <tbody id="auth-user-tbody"><tr class="empty-row"><td colspan="4">사용자를 검색하세요.</td></tr></tbody>
        </table>

        <div id="auth-detail" hidden style="margin-top:var(--space-6)">
          <h2 style="padding:0" id="auth-detail-title">결제비밀번호 상태</h2>
          <div class="stats-row">
            <div class="stat-card"><span class="stat-label">설정 여부</span><span class="stat-value" id="auth-cred-set">-</span></div>
            <div class="stat-card"><span class="stat-label">버전</span><span class="stat-value" id="auth-cred-version">-</span></div>
            <div class="stat-card stat-card--alert"><span class="stat-label">잠금 상태</span><span class="stat-value" id="auth-cred-locked">-</span></div>
          </div>
          <div class="form-row">
            <input type="text" id="auth-reset-reason" placeholder="초기화 사유 (필수)" style="min-width:280px" />
            <button class="btn-danger" id="auth-reset-btn">결제비밀번호 강제 초기화 + 전체 세션 폐기</button>
          </div>
          <p id="auth-action-msg" class="generate-msg"></p>

          <h2 style="padding:0;margin-top:var(--space-5)">결제 인증세션 (최근 20건)</h2>
          <table class="data-table">
            <thead><tr><th>ID</th><th>목적</th><th>스코프</th><th>디바이스</th><th>만료</th><th>상태</th><th>처리</th></tr></thead>
            <tbody id="auth-payment-sessions-tbody"></tbody>
          </table>

          <h2 style="padding:0;margin-top:var(--space-5)">경매 입장세션 (최근 20건)</h2>
          <table class="data-table">
            <thead><tr><th>ID</th><th>경매ID</th><th>스코프</th><th>만료</th><th>상태</th><th>처리</th></tr></thead>
            <tbody id="auth-access-sessions-tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="/admin/admin.js"></script>
</body>
</html>
