<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1280" />
  <title>경매 관리(REST) · NH 바로팜 어드민</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body data-page="rest-auctions">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar__brand">NH <span class="accent">바로팜</span></div>
      <nav class="sidebar__nav">
        <a class="sidebar__link" href="/admin">대시보드</a>
        <a class="sidebar__link" href="/admin/users">사용자</a>
        <a class="sidebar__link" href="/admin/auctions">경매·라이브</a>
        <a class="sidebar__link" href="/admin/products">상품·거래</a>
        <a class="sidebar__link" href="/admin/settlements">정산</a>
        <a class="sidebar__link" href="/admin/payments">결제 관리</a>
        <a class="sidebar__link" href="/admin/wallet">지갑 관리</a>
        <a class="sidebar__link" href="/admin/payment-auth">인증 관리</a>
        <a class="sidebar__link sidebar__link--active" href="/admin/rest-auctions">경매 관리(REST)</a>
      </nav>
      <a id="logout-btn" class="sidebar__logout" href="#">로그아웃</a>
    </aside>

    <main class="main">
      <div class="page-pad">
        <div class="page-header">
          <h1>경매 관리 (REST 인증형)</h1>
        </div>
        <p class="text-muted">기존 소켓 기반 라이브 경매는 &quot;경매·라이브&quot; 화면에서 관리합니다. 이 화면은 <code>bidding_channel=REST</code>인 인증형 경매만 대상으로 합니다.</p>
        <div class="search-bar">
          <input type="text" id="rest-auction-search" placeholder="상품명 검색">
          <select id="rest-auction-status-filter">
            <option value="">전체 상태</option>
            <option value="pending">대기</option>
            <option value="live">진행중</option>
            <option value="ended">종료</option>
          </select>
          <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="rest-auction-unpaid-only" style="width:auto" /> 미결제 낙찰만</label>
          <button id="rest-auction-search-btn">검색</button>
        </div>
        <table class="data-table">
          <thead><tr><th>ID</th><th>상품명</th><th>낙찰가</th><th>상태</th><th>판매자</th><th>낙찰자</th><th>인증모드</th><th>결제상태</th><th>결제기한</th></tr></thead>
          <tbody id="rest-auctions-tbody"></tbody>
        </table>
        <div class="pagination" id="rest-auctions-pagination"></div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="rest-auction-modal" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="rest-auction-modal-title">경매 상세</h3>
        <button class="modal-close" id="rest-auction-modal-close">✕</button>
      </div>
      <div class="modal-meta" id="rest-auction-modal-meta"></div>
      <div class="modal-body" style="padding-top:0">
        <div class="modal-section-title">인증 설정</div>
        <div class="modal-field--row">
          <select id="rest-auction-auth-mode">
            <option value="PAYMENT_ONLY">PAYMENT_ONLY</option>
            <option value="AUCTION_ENTRY">AUCTION_ENTRY</option>
            <option value="ENTRY_AND_PAYMENT">ENTRY_AND_PAYMENT</option>
            <option value="ALWAYS">ALWAYS</option>
          </select>
          <input type="number" id="rest-auction-high-value" placeholder="고액입찰 재인증 기준(원), 비우면 기본값" style="max-width:240px" />
          <button class="btn-small" id="rest-auction-auth-save-btn">저장</button>
        </div>
        <p id="rest-auction-auth-msg" class="generate-msg"></p>

        <div class="modal-section-title">주문/결제 현황</div>
        <table class="data-table" style="width:100%;margin:0 0 var(--space-4)">
          <thead><tr><th>주문ID</th><th>상태</th><th>결제금액</th><th>결제기한</th><th>생성일시</th></tr></thead>
          <tbody id="rest-auction-orders-tbody"></tbody>
        </table>

        <div class="modal-section-title">입찰 내역</div>
        <table class="data-table" style="width:100%;margin:0">
          <thead><tr><th>입찰ID</th><th>입찰자</th><th>금액</th><th>상태</th><th>일시</th></tr></thead>
          <tbody id="rest-auction-bids-tbody"></tbody>
        </table>
      </div>
      <div class="modal-footer">
        <button id="rest-auction-modal-close2" class="btn-small btn-secondary">닫기</button>
      </div>
    </div>
  </div>

  <script src="/admin/admin.js"></script>
</body>
</html>
