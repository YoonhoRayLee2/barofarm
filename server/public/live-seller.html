<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Barofarm Live - Seller</title>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0A0F0D;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
      overflow: hidden;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #0A0F0D;
    }

    #localVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #0A0F0D;
    }

    /* 상단 바 */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: env(safe-area-inset-top, 16px) 16px 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0));
      pointer-events: none;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FF3B3B;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.5px;
      padding: 6px 10px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(255, 59, 59, 0.4);
    }

    .live-badge::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #FFFFFF;
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .quality-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .quality-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9AA0A6;
      transition: background 0.2s;
    }

    .quality-dot.excellent { background: #4ADE80; }
    .quality-dot.good      { background: #A7F3A0; }
    .quality-dot.poor      { background: #FACC15; }
    .quality-dot.lost      { background: #FF3B3B; }

    /* 하단 컨트롤 */
    .controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px 16px calc(env(safe-area-inset-bottom, 16px) + 24px) 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: linear-gradient(to top, rgba(0,0,0,0.6), rgba(0,0,0,0));
    }

    .ctrl-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease;
    }

    .ctrl-btn:active { transform: scale(0.94); }

    .ctrl-btn.muted {
      background: rgba(255, 59, 59, 0.85);
    }

    .ctrl-btn.end {
      width: 72px;
      height: 72px;
      background: #FF3B3B;
      box-shadow: 0 4px 16px rgba(255, 59, 59, 0.45);
    }

    .ctrl-btn svg {
      width: 26px;
      height: 26px;
    }

    /* 상태 오버레이 */
    .status-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      background: #0A0F0D;
      color: #FFFFFF;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    .status-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.18);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .status-text {
      font-size: 14px;
      color: #C7CDD3;
    }
  </style>
</head>
<body>
  <div id="stage">
    <video id="localVideo" autoplay muted playsinline></video>

    <div class="top-bar">
      <span class="live-badge" id="liveBadge" style="visibility: hidden;">LIVE</span>
      <span class="quality-pill">
        <span class="quality-dot" id="qualityDot"></span>
        <span id="qualityLabel">연결 중</span>
      </span>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="micBtn" aria-label="마이크 토글">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>

      <button class="ctrl-btn end" id="endBtn" aria-label="방송 종료">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="6" y1="6" x2="18" y2="18"/>
          <line x1="18" y1="6" x2="6" y2="18"/>
        </svg>
      </button>

      <button class="ctrl-btn" id="camBtn" aria-label="카메라 토글">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 7l-7 5 7 5V7z"/>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
        </svg>
      </button>
    </div>

    <div class="status-overlay" id="statusOverlay">
      <div class="spinner"></div>
      <div class="status-text" id="statusText">연결 중...</div>
    </div>
  </div>

  <script>
    (function () {
      const LK = window.LivekitClient;
      const params = new URLSearchParams(location.search);
      const serverUrl = params.get('serverUrl');
      const token = params.get('token');

      const $ = (id) => document.getElementById(id);
      const localVideoEl = $('localVideo');
      const liveBadge = $('liveBadge');
      const qualityDot = $('qualityDot');
      const qualityLabel = $('qualityLabel');
      const micBtn = $('micBtn');
      const camBtn = $('camBtn');
      const endBtn = $('endBtn');
      const statusOverlay = $('statusOverlay');
      const statusText = $('statusText');

      const postToFlutter = (message) => {
        try { window.FlutterChannel?.postMessage(message); } catch (e) { /* noop */ }
        if (!window.FlutterChannel && window.parent && window.parent !== window) {
          window.parent.postMessage(message, '*');
        }
      };

      if (!serverUrl || !token) {
        statusText.textContent = '연결 정보가 부족합니다.';
        return;
      }

      const room = new LK.Room({
        adaptiveStream: true,
        dynacast: true,
        publishDefaults: {
          videoSimulcastLayers: [LK.VideoPresets.h540, LK.VideoPresets.h216],
        },
      });

      let micEnabled = true;
      let camEnabled = true;
      let cameraTrack = null;
      let micTrack = null;

      const setQuality = (q) => {
        qualityDot.classList.remove('excellent', 'good', 'poor', 'lost');
        switch (q) {
          case LK.ConnectionQuality.Excellent:
            qualityDot.classList.add('excellent');
            qualityLabel.textContent = '연결 매우 좋음';
            break;
          case LK.ConnectionQuality.Good:
            qualityDot.classList.add('good');
            qualityLabel.textContent = '연결 좋음';
            break;
          case LK.ConnectionQuality.Poor:
            qualityDot.classList.add('poor');
            qualityLabel.textContent = '연결 불안정';
            break;
          case LK.ConnectionQuality.Lost:
            qualityDot.classList.add('lost');
            qualityLabel.textContent = '연결 끊김';
            break;
          default:
            qualityLabel.textContent = '연결 확인 중';
        }
      };

      room.on(LK.RoomEvent.ConnectionQualityChanged, (quality, participant) => {
        if (participant?.isLocal) setQuality(quality);
      });

      room.on(LK.RoomEvent.Disconnected, () => {
        liveBadge.style.visibility = 'hidden';
        statusOverlay.classList.remove('hidden');
        statusText.textContent = '방송이 종료되었습니다.';
      });

      const startBroadcast = async () => {
        try {
          await room.connect(serverUrl, token);

          // 후면 카메라
          cameraTrack = await LK.createLocalVideoTrack({
            facingMode: 'environment',
            resolution: LK.VideoPresets.h720.resolution,
          });
          micTrack = await LK.createLocalAudioTrack({
            echoCancellation: true,
            noiseSuppression: true,
          });

          cameraTrack.attach(localVideoEl);
          await room.localParticipant.publishTrack(cameraTrack);
          await room.localParticipant.publishTrack(micTrack);

          statusOverlay.classList.add('hidden');
          liveBadge.style.visibility = 'visible';
          setQuality(room.localParticipant.connectionQuality);
        } catch (err) {
          console.error('[live-seller] 연결 실패:', err);
          statusText.textContent = '연결 실패: ' + (err?.message ?? err);
          postToFlutter('onLiveError');
        }
      };

      micBtn.addEventListener('click', async () => {
        micEnabled = !micEnabled;
        if (micTrack) {
          micEnabled ? await micTrack.unmute() : await micTrack.mute();
        }
        micBtn.classList.toggle('muted', !micEnabled);
      });

      camBtn.addEventListener('click', async () => {
        camEnabled = !camEnabled;
        if (cameraTrack) {
          camEnabled ? await cameraTrack.unmute() : await cameraTrack.mute();
        }
        camBtn.classList.toggle('muted', !camEnabled);
      });

      endBtn.addEventListener('click', async () => {
        try {
          await room.disconnect();
        } catch (e) { /* noop */ }
        postToFlutter('onLiveEnd');
      });

      window.addEventListener('beforeunload', () => {
        try { room.disconnect(); } catch (e) { /* noop */ }
      });

      startBroadcast();
    })();
  </script>
</body>
</html>
